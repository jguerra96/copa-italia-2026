# Cada 15 minutos baja coppaitalia.cl y actualiza oficial.json (cuadros, horarios y resultados oficiales).
name: Sincronizar coppaitalia.cl
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: coppa
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bajar y leer la página oficial
        run: |
          curl -fsSL --retry 3 -m 60 -A 'Mozilla/5.0 (Stade Francais - copa-italia-2026)' https://www.coppaitalia.cl/ -o "$RUNNER_TEMP/coppa.html"
          # Desde el 16-oct la página oficial carga los resultados aparte (tabla pública "resultados" en Supabase),
          # con la dirección y la clave pública que vienen escritas en la misma página.
          SB_URL=$(grep -oE "const SB_URL='[^']+'" "$RUNNER_TEMP/coppa.html" | head -1 | cut -d"'" -f2)
          SB_KEY=$(grep -oE "const SB_KEY='[^']+'" "$RUNNER_TEMP/coppa.html" | head -1 | cut -d"'" -f2)
          echo '[]' > "$RUNNER_TEMP/resultados.json"
          if [ -n "$SB_URL" ] && [ -n "$SB_KEY" ]; then
            curl -fsS --retry 3 -m 30 "$SB_URL/rest/v1/resultados?select=conf_id,partidos" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -o "$RUNNER_TEMP/resultados.json" || { echo "No se pudieron leer los resultados"; echo '[]' > "$RUNNER_TEMP/resultados.json"; }
          fi
          node -e "const r=require(process.argv[1]);console.log('Resultados oficiales:',r.length,r.map(x=>x.conf_id).join(' '))" "$RUNNER_TEMP/resultados.json" || true
          node scripts/coppa.js "$RUNNER_TEMP/coppa.html" oficial.json "$RUNNER_TEMP/resultados.json" > "$RUNNER_TEMP/oficial.json"
          cp "$RUNNER_TEMP/oficial.json" oficial.json
      - name: Guardar copia de la página oficial (para revisar cambios de formato)
        uses: actions/upload-artifact@v4
        with:
          name: coppa-html
          path: ${{ runner.temp }}/coppa.html
          retention-days: 3
      - name: Mostrar datos oficiales en el registro
        run: sed -n '/const CLUBS=/,/---------- motor/p' "$RUNNER_TEMP/coppa.html" | cut -c1-2000
      - name: Buscar de dónde carga resultados la página oficial
        run: grep -noE '.{0,80}(fetch\(|firebase|supabase|XMLHttpRequest|localStorage|RESULTS\[|\.json|/api/).{0,120}' "$RUNNER_TEMP/coppa.html" | head -40 || true
      - name: Guardar si cambió
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- oficial.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "coppa-sync"
          git config user.email "coppa-sync@users.noreply.github.com"
          git add oficial.json
          git commit -m "Datos oficiales de coppaitalia.cl"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
